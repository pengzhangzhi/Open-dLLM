model:
  model_path: Qwen/Qwen3.6-35B-A3B
  attn_implementation: eager

data:
  train_path: /run/media/johndpope/12TB/open_dllm/ldlm_data/data.jsonl
  train_size: 100000
  dataloader_type: native
  data_type: plaintext
  max_seq_len: 512
  text_keys: text
  drop_last: true
  datasets_type: mapping
  num_workers: 2
  prefetch_factor: 2

train:
  output_dir: /run/media/johndpope/12TB/open_dllm/checkpoints/35b_a3b_repr_align
  data_parallel_mode: fsdp1
  ulysses_parallel_size: 1
  global_batch_size: 16
  micro_batch_size: 1
  rmpad: false
  rmpad_with_pos_ids: true
  bsz_warmup_ratio: 0.0
  dyn_bsz_margin: 0
  dyn_bsz_buffer_size: 200
  enable_masking: true
  repr_align_wt: 1.0
  repr_align_sub_sample_ratio: 0.5
  freeze_layers: ""
  optimizer: adamw
  lr: 1.0e-4
  lr_warmup_ratio: 0.01
  lr_decay_style: cosine
  lr_decay_ratio: 1.0
  lr_min: 1.0e-6
  weight_decay: 0.01
  max_grad_norm: 1.0
  enable_mixed_precision: true
  enable_gradient_checkpointing: true
  enable_full_shard: true
  enable_fsdp_offload: false
  enable_activation_offload: false
  init_device: cpu
  enable_full_determinism: false
  empty_cache_steps: 100
  ckpt_manager: dcp
  load_checkpoint_path: ""
  save_steps: 500
  save_hf_weights: true
  use_wandb: true
  wandb_project: Qwen3.6-35B-A3B-ReprAlign
  wandb_name: 35b-a3b-repr-align-w1.0
  auto_resume: true
  save_time_interval_minutes: 170
