# QLoRA Repr-Align — Qwen3.6-27B, 10 steps smoke test
#
# 4-bit NF4 base + LoRA r=16 adapters.
# Expected memory: ~13-16 GiB (fits on 5090 32GB or Blackwell 24GB)
#
# Launch:
#   CUDA_VISIBLE_DEVICES=0 .venv/bin/torchrun --nproc_per_node=1 \
#       tasks/train_torch.py configs/pretrain/qlorafy_27b.yaml

model:
  model_path: /home/johndpope/ds_offload/models/Qwen3.6-27B
  attn_implementation: sdpa
  enable_qlorafy: true
  qlorafy_config:
    r: 16
    lora_alpha: 32
    lora_dropout: 0.05
    target_modules:
      - q_proj
      - k_proj
      - v_proj
      - o_proj
      - gate_proj
      - up_proj
      - down_proj
    use_rslora: true

data:
  train_path: /tmp/smoke_20.jsonl
  train_size: 20
  dataloader_type: native
  data_type: plaintext
  max_seq_len: 1024
  text_keys: text
  drop_last: true
  datasets_type: mapping
  num_workers: 2
  prefetch_factor: 2

train:
  output_dir: /home/johndpope/ds_offload/checkpoints/qlorafy-27b-smoke
  ulysses_parallel_size: 1
  global_batch_size: 1
  micro_batch_size: 1
  rmpad: false
  rmpad_with_pos_ids: false
  bsz_warmup_ratio: 0.0
  dyn_bsz_margin: 0
  dyn_bsz_buffer_size: 50

  # Repr-Align — 4 evenly-spaced layers out of 64
  enable_masking: true
  repr_align_wt: 1.0
  anchor_cache_dir: /home/johndpope/ds_offload/anchors/qwen3.6-27b
  align_layers: "16,32,48,64"
  repr_align_sub_sample_ratio: 0.25

  # Standard AdamW (only LoRA params — tiny)
  optimizer: adamw
  lr: 2.0e-4
  lr_warmup_ratio: 0.01
  lr_decay_style: cosine
  lr_decay_ratio: 1.0
  lr_min: 2.0e-6
  weight_decay: 0.01
  max_grad_norm: 1.0

  enable_mixed_precision: true
  enable_gradient_checkpointing: true
  enable_full_shard: false
  enable_fsdp_offload: false
  enable_activation_offload: false
  init_device: cuda
  enable_full_determinism: false
  empty_cache_steps: 5

  # DDP — no DeepSpeed overhead needed
  data_parallel_mode: ddp

  ckpt_manager: dcp
  load_checkpoint_path: ""
  save_steps: 100
  save_hf_weights: false
  auto_resume: false
  save_time_interval_minutes: 0

  use_wandb: false

  max_steps: 10
