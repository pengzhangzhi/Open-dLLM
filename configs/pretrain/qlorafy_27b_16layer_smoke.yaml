# QLoRA Repr-Align — Qwen3.6-27B, ALL-64-LAYER smoke test.
#
# Tests that the repr-align signal flows through all 64 layers (not just 4).
# Uses the all64 anchor cache (layers 1..64, max_seq_len=1024, 75 chunks).
# Kept tiny (32 sequences total) to stay under the 75 cached chunks —
# CachedTeacher raises KeyError on any cache miss.
#
# Launch:
#   CUDA_VISIBLE_DEVICES=0 CUDA_DEVICE_ORDER=FASTEST_FIRST \
#     PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True \
#     .venv/bin/python tasks/train_torch.py \
#     configs/pretrain/qlorafy_27b_all64_smoke.yaml > /tmp/qlorafy_all64_smoke.log 2>&1 &

model:
  model_path: /home/johndpope/ds_offload/models/Qwen3.6-27B
  attn_implementation: sdpa
  enable_qlorafy: true
  qlorafy_config:
    r: 32
    lora_alpha: 64
    lora_dropout: 0.05
    target_modules:
      - q_proj
      - k_proj
      - v_proj
      - o_proj
      - gate_proj
      - up_proj
      - down_proj
    use_rslora: true

data:
  train_path: /run/media/johndpope/12TB/open_dllm/ldlm_data/data.jsonl
  train_size: 64
  eval_size: 0
  dataloader_type: native
  data_type: plaintext
  max_seq_len: 1024
  text_keys: text
  drop_last: true
  datasets_type: mapping
  num_workers: 2
  prefetch_factor: 2

train:
  output_dir: /home/johndpope/ds_offload/checkpoints/qlorafy-27b-16layer-smoke
  ulysses_parallel_size: 1
  global_batch_size: 2
  micro_batch_size: 1
  rmpad: false
  rmpad_with_pos_ids: true
  bsz_warmup_ratio: 0.0
  dyn_bsz_margin: 0
  dyn_bsz_buffer_size: 50

  enable_masking: true
  repr_align_wt: 1.0
  anchor_cache_dir: /home/johndpope/ds_offload/anchors/qwen3.6-27b-all64
  align_layers: "4,8,12,16,20,24,28,32,36,40,44,48,52,56,60,64"
  repr_align_sub_sample_ratio: 0.25

  optimizer: adamw
  lr: 2.0e-4
  lr_warmup_ratio: 0.05
  lr_decay_style: cosine
  lr_decay_ratio: 1.0
  lr_min: 2.0e-6
  weight_decay: 0.01
  max_grad_norm: 1.0

  enable_mixed_precision: true
  enable_gradient_checkpointing: true
  enable_full_shard: false
  enable_fsdp_offload: false
  enable_activation_offload: false
  init_device: cuda
  enable_full_determinism: false
  empty_cache_steps: 100

  data_parallel_mode: ddp

  ckpt_manager: dcp
  load_checkpoint_path: ""
  save_steps: 0
  eval_every: 0
  save_epochs: 0
  save_hf_weights: false
  auto_resume: false
  save_time_interval_minutes: 0

  use_wandb: false
  wandb_project: open-dllm
  wandb_name: qlorafy-27b-16layer-smoke

  max_steps: 6
