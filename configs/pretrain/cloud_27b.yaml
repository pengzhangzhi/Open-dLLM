model:
  model_path: /data/models/Qwen3.6-27B
  attn_implementation: sdpa

data:
  train_path: /data/training/data_smoke_1000.jsonl
  train_size: 2097152
  dataloader_type: native
  data_type: plaintext
  max_seq_len: 2048
  text_keys: text
  drop_last: true
  datasets_type: mapping
  num_workers: 4
  prefetch_factor: 2

train:
  output_dir: /data/checkpoints/qwen3.6-27b-repr-align
  data_parallel_mode: deepspeed
  ds_zero_stage: 3
  ds_offload_optimizer: cpu
  ds_overlap_comm: true
  ds_contiguous_gradients: true
  ds_nvme_path: /data/ds_offload
  init_device: cuda
  ulysses_parallel_size: 1
  expert_parallel_size: 1
  global_batch_size: 2
  micro_batch_size: 1
  rmpad: false
  rmpad_with_pos_ids: true
  bsz_warmup_ratio: 0.0
  dyn_bsz_margin: 0
  dyn_bsz_buffer_size: 50
  enable_masking: true
  repr_align_wt: 1.0
  anchor_cache_dir: /data/anchors/qwen3.6-27b
  align_layers: "16,32,48,64"
  freeze_layers: ""
  quantize_frozen: false
  optimizer: anyprecision_adamw
  lr: 1.0e-4
  lr_warmup_ratio: 0.01
  lr_decay_style: cosine
  lr_decay_ratio: 1.0
  lr_min: 1.0e-6
  weight_decay: 0.01
  max_grad_norm: 1.0
  enable_mixed_precision: true
  enable_gradient_checkpointing: true
  save_optimizer_state: false
  enable_full_shard: false
  enable_fsdp_offload: false
  enable_activation_offload: false
  enable_full_determinism: false
  empty_cache_steps: 50
  ckpt_manager: dcp
  load_checkpoint_path: ""
  max_steps: 200
  save_steps: 50
  save_total_limit: 2
  save_hf_weights: true
  save_epochs: 0
  auto_resume: true
  save_time_interval_minutes: 30
  use_wandb: true
  wandb_project: open-dllm-27b
  wandb_name: repr-align-27b-run3
