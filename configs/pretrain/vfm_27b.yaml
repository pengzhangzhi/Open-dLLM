# VFM (Variational Flow Map) — Qwen3.6-27B
#
# Frozen bidirectional LLM + trainable noise adapter.
# RTX 5090 (32 GB), expandable_segments required.
#
# Launch:
#   CUDA_VISIBLE_DEVICES=0 PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True \
#       torchrun --nproc_per_node=1 tasks/train_vfm.py \
#       configs/pretrain/vfm_27b.yaml > /tmp/vfm_27b.log 2>&1 &
#   echo $! > /tmp/vfm_27b.pid

model:
  model_path: /home/johndpope/ds_offload/models/Qwen3.6-27B
  attn_implementation: sdpa
  vfm:
    # Load repr-align trained 27B (QLoRA checkpoint) as the flow map base.
    # merge_and_unload() produces a bf16 model with bidirectional + LoRA weights baked in.
    peft_checkpoint: /home/johndpope/ds_offload/checkpoints/qlorafy-27b-train/checkpoints/eval/hf_ckpt
    adapter_layers: 4
    adapter_heads: 8
    tau: 1.0
    sigma: 1.0
    alpha: 0.5
    freeze_base: true
    max_seq_len: 1024
    # DifferentialReplayLoss: distill T-step trajectory → S-step student
    diff_replay_wt: 0.1
    diff_replay_teacher_steps: 8
    diff_replay_student_steps: 4

data:
  train_path: /run/media/johndpope/12TB/open_dllm/ldlm_data/data.jsonl
  train_size: 1000
  eval_size: 50
  dataloader_type: native
  data_type: plaintext
  max_seq_len: 1024
  text_keys: text
  drop_last: true
  datasets_type: mapping
  num_workers: 2
  prefetch_factor: 2

train:
  output_dir: /home/johndpope/ds_offload/checkpoints/vfm-27b
  ulysses_parallel_size: 1
  global_batch_size: 16
  micro_batch_size: 1
  rmpad: false
  rmpad_with_pos_ids: false
  bsz_warmup_ratio: 0.0
  dyn_bsz_margin: 0
  dyn_bsz_buffer_size: 50

  optimizer: adamw
  lr: 2.0e-4
  lr_warmup_ratio: 0.05
  lr_decay_style: cosine
  lr_decay_ratio: 1.0
  lr_min: 2.0e-6
  weight_decay: 0.01
  max_grad_norm: 1.0

  enable_mixed_precision: true
  enable_gradient_checkpointing: true
  enable_full_shard: false
  enable_fsdp_offload: false
  enable_activation_offload: false
  init_device: cuda
  enable_full_determinism: false
  empty_cache_steps: 100

  data_parallel_mode: ddp

  ckpt_manager: dcp
  load_checkpoint_path: ""
  save_steps: 0
  eval_every: 100
  save_epochs: 0
  save_hf_weights: true
  auto_resume: false
  save_time_interval_minutes: 0

  use_wandb: true
  wandb_project: open-dllm
  wandb_name: vfm-27b-r32

  max_steps: 2000
