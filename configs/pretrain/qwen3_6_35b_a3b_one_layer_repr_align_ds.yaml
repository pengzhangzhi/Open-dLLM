# Repr-Align on Qwen3.6-35B-A3B via DeepSpeed ZeRO-3 + CPU offload.
# Enable training of the full 70 GB model on the MSI box (24 GB + 32 GB GPUs)
# by offloading optimizer states and parameters to CPU RAM (91 GB).
#
# Launch:
#   DS_SKIP_CUDA_CHECK=1 CUDA_VISIBLE_DEVICES=0,1 PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True \
#       torchrun --nproc_per_node=2 \
#       tasks/train_torch.py configs/pretrain/qwen3_6_35b_a3b_one_layer_repr_align_ds.yaml

model:
  model_path: /home/johndpope/.cache/huggingface/hub/models--Qwen--Qwen3.6-35B-A3B/snapshots/995ad96eacd98c81ed38be0c5b274b04031597b0/
  attn_implementation: eager

data:
  train_path: /run/media/johndpope/12TB/open_dllm/ldlm_data/data_smoke_1000.jsonl
  train_size: 1000
  dataloader_type: native
  data_type: plaintext
  max_seq_len: 2048
  text_keys: text
  drop_last: true
  datasets_type: mapping
  num_workers: 2
  prefetch_factor: 2

train:
  output_dir: /run/media/johndpope/12TB/open_dllm/checkpoints/qwen3.6-35b-a3b-one-layer-repr-align-ds
  data_parallel_mode: deepspeed
  ds_zero_stage: 3
  ds_offload_optimizer: nvme   # optimizer states on NVMe; requires libaio-dev + async_io build
  ds_offload_param: cpu
  ds_overlap_comm: true
  ds_contiguous_gradients: true
  ds_nvme_path: /home/johndpope/ds_offload
  # ds_config_path: ""  # bring-your-own DeepSpeed JSON

  ulysses_parallel_size: 1
  expert_parallel_size: 1
  global_batch_size: 2
  micro_batch_size: 1
  rmpad: false
  rmpad_with_pos_ids: true
  bsz_warmup_ratio: 0.0
  dyn_bsz_margin: 0
  dyn_bsz_buffer_size: 50

  # Repr-Align core
  enable_masking: true
  repr_align_wt: 1.0
  anchor_cache_dir: /home/johndpope/ds_offload/anchors/qwen3.6-35b-a3b
  align_layers: "10,20,30,40"

  # One-layer training: freeze everything except model.layers.0.*
  freeze_layers: "embed_tokens,lm_head,model.norm,model.layers.1.,model.layers.2.,model.layers.3.,model.layers.4.,model.layers.5.,model.layers.6.,model.layers.7.,model.layers.8.,model.layers.9.,model.layers.10.,model.layers.11.,model.layers.12.,model.layers.13.,model.layers.14.,model.layers.15.,model.layers.16.,model.layers.17.,model.layers.18.,model.layers.19.,model.layers.20.,model.layers.21.,model.layers.22.,model.layers.23.,model.layers.24.,model.layers.25.,model.layers.26.,model.layers.27.,model.layers.28.,model.layers.29.,model.layers.30.,model.layers.31.,model.layers.32.,model.layers.33.,model.layers.34.,model.layers.35.,model.layers.36.,model.layers.37.,model.layers.38.,model.layers.39."

  # Optional: torchao weight-only quantization of frozen Linear modules
  quantize_frozen: false
  quantize_frozen_dtype: int8

  optimizer: anyprecision_adamw
  lr: 1.0e-4
  lr_warmup_ratio: 0.01
  lr_decay_style: cosine
  lr_decay_ratio: 1.0
  lr_min: 1.0e-6
  weight_decay: 0.01
  max_grad_norm: 1.0

  enable_mixed_precision: true
  enable_gradient_checkpointing: true
  # FSDP-specific fields are ignored when data_parallel_mode=deepspeed
  enable_full_shard: false
  enable_fsdp_offload: false
  enable_activation_offload: false
  init_device: cpu                 # cpu-init inside zero.Init() context; weights loaded post-DS-init
  enable_full_determinism: false
  empty_cache_steps: 50

  ckpt_manager: dcp               # DeepSpeed checkpointer overrides this
  load_checkpoint_path: ""
  save_steps: 100
  save_hf_weights: false
  auto_resume: true
  save_time_interval_minutes: 60

  use_wandb: true
  wandb_project: open-dllm-smoke
  wandb_name: qwen3.6-35b-a3b-one-layer-repr-align-ds
