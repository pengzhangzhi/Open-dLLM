[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "open-dcoder"
version = "0.1.0"
authors = [
  { name="Fred Z. Peng", email="zp70@duke.edu" },
]
description = "Open-dCoder: Open Diffusion Large Language Model for Code Generation"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["diffusion", "language model", "code generation", "machine learning", "pytorch"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Code Generators",
]

dependencies = [
    "torch>=2.6.0",
    "transformers>=4.57.6",
    "accelerate",
    "datasets",
    "sentencepiece",
    "tiktoken>=0.9.0",
    "wandb",
    "tqdm",
    "pyyaml",
    "safetensors",
    "ninja",
    "einops",
    "packaging",
    "blobfile>=3.0.0",
    "diffusers>=0.30.0,<=0.31.0",
    "peft",
    "hf-transfer",
    "codetiming",
    "hydra-core",
    "pandas",
    "pyarrow>=15.0.0",
    "pylatexenc",
    "torchdata>=0.8.0,<1.0",
]

[project.optional-dependencies]
dev = [
    "pre-commit",
    "ruff",
    "pytest",
]
deepspeed = [
    "deepspeed>=0.15.0",
]
vision = [
    "torchvision",
]
blackwell = [
    # NVFP4 QAT — requires torch + torchao nightly with CUDA 13.0
    # Install with: pip install --pre torch torchao mslk --index-url https://download.pytorch.org/whl/nightly/cu130
    "torch>=2.12.0.dev",
    "torchao>=0.17.0.dev",
    "mslk>=2026.3.0",
]

[tool.ruff]
target-version = "py311"
line-length = 119
indent-width = 4

[tool.ruff.lint]
ignore = ["C901", "E501", "E741", "W605", "C408"]
select = ["C", "E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "F401", "F403", "F811"]

[tool.ruff.lint.isort]
lines-after-imports = 2
known-first-party = ["veomni"]
known-third-party = ["torch", "transformers", "wandb"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.uv]
# Pin torch to CUDA 12.9 for Blackwell (RTX 5090) compatibility
constraint-dependencies = [
    "torch>=2.6.0",
]

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[[tool.uv.index]]
name = "pytorch-nightly-cu130"
url = "https://download.pytorch.org/whl/nightly/cu130"
explicit = true
